name: Public identifier scan
on:
  push:
    branches: [main, sf-visual-library-v2]
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan public source
        shell: bash
        run: |
          set +e
          P1=$(printf '\x41\x6d\x70\x43\x6f\x72\x65\x58')
          P2=$(printf '\x4f\x6d\x61\x72\x20\x53\x68\x61\x67\x6f\x75\x72\x69')
          P3=$(printf '\x6f\x6d\x61\x72\x73\x68\x61\x67\x6f\x75\x72\x69\x40\x67\x6d\x61\x69\x6c\x2e\x63\x6f\x6d')
          grep -RniI -E "$P1|$P2|$P3" . --exclude-dir=.git --exclude=package-lock.json || true
